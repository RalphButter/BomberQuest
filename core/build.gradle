java {
    sourceCompatibility = JavaVersion.VERSION_17
}
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    main {
        java {
            srcDirs = ["src/"]
        }
        // Include the assets directory as part of resources
        resources {
            srcDirs = ["assets"]
        }
    }
}

eclipse.project.name = appName + "-core"
